name: Android-APK bauen

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: APK bauen
        working-directory: android
        run: gradle assembleDebug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: aufgaben-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Direkter Download ohne ZIP:
      # https://github.com/<user>/<repo>/releases/latest/download/Aufgaben.apk
      - name: APK als Release veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Aufgaben.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Aufgaben.apk --target "$GITHUB_SHA" --latest \
            --title "Aufgaben-App (neuester Build)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}."
